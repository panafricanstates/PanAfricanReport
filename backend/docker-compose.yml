version: "3.9"

# Optional local container setup. Celery/Redis are no longer used; periodic
# work is triggered through the /api/cron/ endpoints.
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_news_app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn emergency_news.wsgi:application --bind 0.0.0.0:9000"
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_MAX_WORKERS: ${CRON_MAX_WORKERS:-4}
      CRON_FETCH_CONCURRENCY: ${CRON_FETCH_CONCURRENCY:-4}
